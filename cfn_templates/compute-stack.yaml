AWSTemplateFormatVersion: '2010-09-09'
Description: Compute stack - regional app Lambda and/or Lambda@Edge for CloudFront

Parameters:
  FunctionNameSuffix:
    Type: String
    Default: hello
  ResourceNamePrefix:
    Type: String
    Default: ''
  EnableRegionalApp:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Create Python hello Lambda (ap-south-1 via master)
  EnableEdgeFunction:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Create Lambda@Edge for CloudFront (deploy stack in us-east-1)

Conditions:
  UseResourceNamePrefix: !Not [!Equals [!Ref ResourceNamePrefix, '']]
  CreateRegionalApp: !Equals [!Ref EnableRegionalApp, 'true']
  CreateEdgeFunction: !Equals [!Ref EnableEdgeFunction, 'true']

Resources:
  # CloudWatch log group for the regional hello Lambda (created before the function).
  HelloLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: CreateRegionalApp
    Properties:
      LogGroupName: !If
        - UseResourceNamePrefix
        - !Sub '/aws/lambda/${ResourceNamePrefix}-${FunctionNameSuffix}'
        - !Sub '/aws/lambda/${AWS::StackName}-${FunctionNameSuffix}'
      RetentionInDays: 7

  # Execution role: Lambda service can assume it and write logs (basic execution policy).
  HelloLambdaRole:
    Type: AWS::IAM::Role
    Condition: CreateRegionalApp
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  # Regional API-style hello (master stack: EnableRegionalApp=true, ap-south-1).
  HelloFunction:
    Type: AWS::Lambda::Function
    Condition: CreateRegionalApp
    DependsOn: HelloLogGroup
    Properties:
      FunctionName: !If
        - UseResourceNamePrefix
        - !Sub '${ResourceNamePrefix}-${FunctionNameSuffix}'
        - !Sub '${AWS::StackName}-${FunctionNameSuffix}'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt HelloLambdaRole.Arn
      Timeout: 10
      MemorySize: 128
      Code:
        ZipFile: |
          import json

          def handler(event, context):
              return {
                  "statusCode": 200,
                  "body": json.dumps({
                      "message": "Hello from CloudFormation + Lambda",
                      "requestId": context.aws_request_id,
                  }),
              }

  # Edge role: both lambda.amazonaws.com and edgelambda.amazonaws.com must trust the role.
  ApplySecurityHeadersRole:
    Type: AWS::IAM::Role
    Condition: CreateEdgeFunction
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
                - edgelambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  # Lambda@Edge code (deploy stack in us-east-1 only); CSP/HSTS applied on origin-response.
  ApplySecurityHeadersFunction:
    Type: AWS::Lambda::Function
    Condition: CreateEdgeFunction
    Properties:
      FunctionName: !If
        - UseResourceNamePrefix
        - !Sub '${ResourceNamePrefix}-applySecurityHeaders'
        - !Sub '${AWS::StackName}-applySecurityHeaders'
      Runtime: nodejs22.x
      Handler: index.applySecurityHeaders
      Role: !GetAtt ApplySecurityHeadersRole.Arn
      Timeout: 5
      MemorySize: 128
      Code:
        ZipFile: |
          'use strict';
          var SECURITY_HEADERS = {
            'content-security-policy': {
              key: 'Content-Security-Policy',
              value: "default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'self'"
            },
            'strict-transport-security': {
              key: 'Strict-Transport-Security',
              value: 'max-age=63072000; includeSubDomains; preload'
            },
            'x-content-type-options': {
              key: 'X-Content-Type-Options',
              value: 'nosniff'
            }
          };
          function applySecurityHeaders(response) {
            var headers = response.headers;
            Object.keys(SECURITY_HEADERS).forEach(function (name) {
              headers[name] = [SECURITY_HEADERS[name]];
            });
            return response;
          }
          exports.applySecurityHeaders = (event, context, callback) => {
            var record = event.Records[0].cf;
            var eventType = record.config.eventType;
            if (eventType === 'viewer-request') {
              callback(null, record.request);
              return;
            }
            if (eventType === 'origin-response') {
              callback(null, applySecurityHeaders(record.response));
              return;
            }
            callback(null, record.response || record.request);
          };

  # Immutable published version ARN — CloudFront associations must point at a version, not $LATEST.
  ApplySecurityHeadersVersion:
    Type: AWS::Lambda::Version
    Condition: CreateEdgeFunction
    Properties:
      FunctionName: !Ref ApplySecurityHeadersFunction

Outputs:
  FunctionName:
    Condition: CreateRegionalApp
    Value: !Ref HelloFunction

  FunctionArn:
    Condition: CreateRegionalApp
    Value: !GetAtt HelloFunction.Arn

  EdgeLambdaVersionArn:
    Condition: CreateEdgeFunction
    Description: Publish in us-east-1; pass to network-stack
    Value: !Ref ApplySecurityHeadersVersion
