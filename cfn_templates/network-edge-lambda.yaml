AWSTemplateFormatVersion: '2010-09-09'
Description: Edge Lambda (us-east-1) - viewer-response security headers for CloudFront

Resources:
  EdgeSecurityRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
                - edgelambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  EdgeSecurityFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-viewer-response'
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt EdgeSecurityRole.Arn
      Timeout: 5
      MemorySize: 128
      Code:
        ZipFile: |
          'use strict';
          exports.handler = (event, context, callback) => {
            const response = event.Records[0].cf.response;
            const headers = response.headers;
            headers['content-security-policy'] = [{
              key: 'Content-Security-Policy',
              value: "default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'self'"
            }];
            headers['strict-transport-security'] = [{
              key: 'Strict-Transport-Security',
              value: 'max-age=63072000; includeSubDomains; preload'
            }];
            headers['x-content-type-options'] = [{
              key: 'X-Content-Type-Options',
              value: 'nosniff'
            }];
            callback(null, response);
          };

  EdgeSecurityVersion:
    Type: AWS::Lambda::Version
    Properties:
      FunctionName: !Ref EdgeSecurityFunction

Outputs:
  ViewerResponseLambdaVersionArn:
    Description: Lambda@Edge version ARN for CloudFront viewer-response association
    Value: !Ref EdgeSecurityVersion
