AWSTemplateFormatVersion: '2010-09-09'
Description: Master stack - nested compute and persistent stacks

Parameters:
  TemplateS3Bucket:
    Type: String
    Description: S3 bucket that holds nested stack templates (compute-stack.yaml, persistent-stack.yaml)
  TemplateS3Prefix:
    Type: String
    Default: templates/
    Description: Key prefix in the bucket (must end with /)
  ComputeResourcePrefix:
    Type: String
    Default: simple-compute-dev
    Description: Lambda/log naming prefix (same as standalone compute stack name)
  PersistentResourcePrefix:
    Type: String
    Default: simple-persistent-dev
    Description: S3/CloudFront naming prefix (same as standalone persistent stack name)

Resources:
  ComputeStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://${TemplateS3Bucket}.s3.${AWS::Region}.amazonaws.com/${TemplateS3Prefix}compute-stack.yaml'
      Parameters:
        ResourceNamePrefix: !Ref ComputeResourcePrefix
      TimeoutInMinutes: 15

  PersistentStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://${TemplateS3Bucket}.s3.${AWS::Region}.amazonaws.com/${TemplateS3Prefix}persistent-stack.yaml'
      Parameters:
        ResourceNamePrefix: !Ref PersistentResourcePrefix
      TimeoutInMinutes: 60

Outputs:
  FunctionName:
    Description: Lambda function name
    Value: !GetAtt ComputeStack.Outputs.FunctionName

  FunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt ComputeStack.Outputs.FunctionArn

  BucketName:
    Description: S3 bucket for static site
    Value: !GetAtt PersistentStack.Outputs.BucketName

  WebsiteURL:
    Description: S3 website URL (no CSP header)
    Value: !GetAtt PersistentStack.Outputs.WebsiteURL

  CloudFrontURL:
    Description: HTTPS URL with CSP response header
    Value: !GetAtt PersistentStack.Outputs.CloudFrontURL

  CloudFrontDistributionId:
    Description: CloudFront distribution ID for cache invalidation
    Value: !GetAtt PersistentStack.Outputs.CloudFrontDistributionId
