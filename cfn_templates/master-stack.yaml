AWSTemplateFormatVersion: '2010-09-09'
Description: Master stack - nested compute, persistent, and network (Lambda@Edge ARN from us-east-1 compute stack)

Parameters:
  TemplateS3Bucket:
    Type: String
    Description: S3 bucket that holds nested stack templates
  TemplateS3Prefix:
    Type: String
    Default: templates/
    Description: Key prefix in the bucket (must end with /)
  ComputeResourcePrefix:
    Type: String
    Default: simple-compute-dev
  PersistentResourcePrefix:
    Type: String
    Default: simple-persistent-dev
  NetworkResourcePrefix:
    Type: String
    Default: simple-network-dev
  EdgeLambdaVersionArn:
    Type: String
    Default: ''
    Description: Lambda@Edge version from compute stack in us-east-1; omit to skip NetworkStack
  WebACLArn:
    Type: String
    Default: ''
    Description: WAFv2 web ACL ARN from waf-stack (us-east-1); attach to CloudFront via WebACLId

Conditions:
  DeployNetwork: !Not [!Equals [!Ref EdgeLambdaVersionArn, '']]

Resources:
  # Nested stack: regional Python hello Lambda + IAM + log group (same region as master).
  ComputeStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://${TemplateS3Bucket}.s3.${AWS::Region}.amazonaws.com/${TemplateS3Prefix}compute-stack.yaml'
      Parameters:
        ResourceNamePrefix: !Ref ComputeResourcePrefix
        EnableRegionalApp: 'true'
        EnableEdgeFunction: 'false'
      TimeoutInMinutes: 15

  # Nested stack: S3 bucket, static website config, public read policy for index.html.
  PersistentStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://${TemplateS3Bucket}.s3.${AWS::Region}.amazonaws.com/${TemplateS3Prefix}persistent-stack.yaml'
      Parameters:
        ResourceNamePrefix: !Ref PersistentResourcePrefix
      TimeoutInMinutes: 30

  # Nested stack: CloudFront in the same region as master (ap-south-1); edge function ARN is from us-east-1 only.
  NetworkStack:
    Type: AWS::CloudFormation::Stack
    Condition: DeployNetwork
    DependsOn: PersistentStack
    Properties:
      TemplateURL: !Sub 'https://${TemplateS3Bucket}.s3.${AWS::Region}.amazonaws.com/${TemplateS3Prefix}network-stack.yaml'
      Parameters:
        ResourceNamePrefix: !Ref NetworkResourcePrefix
        OriginDomainName: !GetAtt PersistentStack.Outputs.WebsiteOriginDomainName
        EdgeLambdaVersionArn: !Ref EdgeLambdaVersionArn
        WebACLArn: !Ref WebACLArn
      TimeoutInMinutes: 30

Outputs:
  FunctionName:
    Value: !GetAtt ComputeStack.Outputs.FunctionName

  FunctionArn:
    Value: !GetAtt ComputeStack.Outputs.FunctionArn

  BucketName:
    Value: !GetAtt PersistentStack.Outputs.BucketName

  WebsiteURL:
    Value: !GetAtt PersistentStack.Outputs.WebsiteURL

  WebsiteOriginDomainName:
    Description: S3 website hostname used as CloudFront origin
    Value: !GetAtt PersistentStack.Outputs.WebsiteOriginDomainName

  CloudFrontURL:
    Condition: DeployNetwork
    Description: HTTPS site URL (CSP/HSTS via Lambda@Edge on origin-response)
    Value: !GetAtt NetworkStack.Outputs.CloudFrontURL

  CloudFrontDistributionId:
    Condition: DeployNetwork
    Description: Use for cache invalidation after uploading index.html
    Value: !GetAtt NetworkStack.Outputs.CloudFrontDistributionId

  CloudFrontDistributionArn:
    Condition: DeployNetwork
    Description: Pass to waf-stack in us-east-1
    Value: !GetAtt NetworkStack.Outputs.CloudFrontDistributionArn
