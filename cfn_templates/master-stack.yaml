AWSTemplateFormatVersion: '2010-09-09'
Description: Master stack - nested compute, persistent, and network stacks

Parameters:
  TemplateS3Bucket:
    Type: String
    Description: S3 bucket that holds nested stack templates
  TemplateS3Prefix:
    Type: String
    Default: templates/
    Description: Key prefix in the bucket (must end with /)
  ComputeResourcePrefix:
    Type: String
    Default: simple-compute-dev
  PersistentResourcePrefix:
    Type: String
    Default: simple-persistent-dev
  NetworkResourcePrefix:
    Type: String
    Default: simple-network-dev
  ViewerResponseLambdaVersionArn:
    Type: String
    Description: Lambda@Edge version ARN from network-edge-lambda (deploy in us-east-1)

Resources:
  ComputeStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://${TemplateS3Bucket}.s3.${AWS::Region}.amazonaws.com/${TemplateS3Prefix}compute-stack.yaml'
      Parameters:
        ResourceNamePrefix: !Ref ComputeResourcePrefix
      TimeoutInMinutes: 15

  PersistentStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://${TemplateS3Bucket}.s3.${AWS::Region}.amazonaws.com/${TemplateS3Prefix}persistent-stack.yaml'
      Parameters:
        ResourceNamePrefix: !Ref PersistentResourcePrefix
      TimeoutInMinutes: 30

  NetworkStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: PersistentStack
    Properties:
      TemplateURL: !Sub 'https://${TemplateS3Bucket}.s3.${AWS::Region}.amazonaws.com/${TemplateS3Prefix}network-stack.yaml'
      Parameters:
        ResourceNamePrefix: !Ref NetworkResourcePrefix
        OriginDomainName: !GetAtt PersistentStack.Outputs.WebsiteOriginDomainName
        ViewerResponseLambdaVersionArn: !Ref ViewerResponseLambdaVersionArn
      TimeoutInMinutes: 60

Outputs:
  FunctionName:
    Value: !GetAtt ComputeStack.Outputs.FunctionName

  FunctionArn:
    Value: !GetAtt ComputeStack.Outputs.FunctionArn

  BucketName:
    Value: !GetAtt PersistentStack.Outputs.BucketName

  WebsiteURL:
    Value: !GetAtt PersistentStack.Outputs.WebsiteURL

  CloudFrontURL:
    Description: Use this URL for CSP / HSTS / nosniff headers (edge Lambda)
    Value: !GetAtt NetworkStack.Outputs.CloudFrontURL

  CloudFrontDistributionId:
    Value: !GetAtt NetworkStack.Outputs.CloudFrontDistributionId
