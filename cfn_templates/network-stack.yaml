AWSTemplateFormatVersion: '2010-09-09'
Description: Network stack - CloudFront with Lambda@Edge from compute stack

Parameters:
  ResourceNamePrefix:
    Type: String
    Default: ''
  OriginDomainName:
    Type: String
    Description: S3 website origin from persistent stack
  EdgeLambdaVersionArn:
    Type: String
    Description: Lambda@Edge version ARN from compute stack (us-east-1)

Conditions:
  UseResourceNamePrefix: !Not [!Equals [!Ref ResourceNamePrefix, '']]

Resources:
  # Global CDN in front of the S3 website origin (deploy this stack in us-east-1 with edge Lambda ARN).
  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !If
          - UseResourceNamePrefix
          - !Sub '${ResourceNamePrefix} CDN (edge Lambda from compute stack)'
          - !Sub '${AWS::StackName} CDN (edge Lambda from compute stack)'
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_200
        # Custom origin (not S3 REST API): hostname from persistent stack WebsiteOriginDomainName.
        Origins:
          - Id: S3WebsiteOrigin
            DomainName: !Ref OriginDomainName
            CustomOriginConfig:
              # S3 static website endpoints speak HTTP on port 80 only.
              OriginProtocolPolicy: http-only
              HTTPPort: 80
              HTTPSPort: 443
        DefaultCacheBehavior:
          TargetOriginId: S3WebsiteOrigin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          # AWS managed caching optimized policy (CachePolicyId is fixed by AWS).
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          # Same Lambda@Edge version: pass-through on request, add CSP/HSTS on origin-response.
          LambdaFunctionAssociations:
            - EventType: viewer-request
              LambdaFunctionARN: !Ref EdgeLambdaVersionArn
            - EventType: origin-response
              LambdaFunctionARN: !Ref EdgeLambdaVersionArn

Outputs:
  CloudFrontURL:
    Value: !Sub 'https://${SiteDistribution.DomainName}'

  CloudFrontDistributionId:
    Value: !Ref SiteDistribution
