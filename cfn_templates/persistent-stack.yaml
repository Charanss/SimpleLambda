AWSTemplateFormatVersion: '2010-09-09'
Description: Persistent stack - S3 bucket and static website (data layer)

Parameters:
  ResourceNamePrefix:
    Type: String
    Default: ''
    Description: Optional fixed prefix for bucket names (master stack); empty uses AWS::StackName

Conditions:
  UseResourceNamePrefix: !Not [!Equals [!Ref ResourceNamePrefix, '']]

Resources:
  # Object storage + static website hosting; CloudFront pulls from the website endpoint hostname.
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !If
        - UseResourceNamePrefix
        - !Sub '${ResourceNamePrefix}-${AWS::AccountId}'
        - !Sub '${AWS::StackName}-${AWS::AccountId}'
      # Allow a public bucket policy below (required for anonymous GetObject on a public site).
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      WebsiteConfiguration:
        IndexDocument: index.html

  # Lets anyone read objects (e.g. index.html); does not grant list/upload/delete.
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'

Outputs:
  BucketName:
    Description: S3 bucket name (upload index.html here)
    Value: !Ref SiteBucket

  WebsiteURL:
    Description: S3 static website URL (direct, no edge security headers)
    Value: !GetAtt SiteBucket.WebsiteURL

  WebsiteOriginDomainName:
    Description: S3 website origin hostname for CloudFront (network stack)
    Value: !Sub '${SiteBucket}.s3-website.${AWS::Region}.amazonaws.com'
