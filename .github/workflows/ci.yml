name: CI

# Lint on PR; on push to main, call CD after lint passes (deploy job below).

on:
  pull_request:
    paths:
      - cfn_templates/**
      - static/**
      - .github/workflows/ci.yml
      - .github/workflows/cd.yml
  push:
    branches:
      - main
    paths:
      - cfn_templates/**
      - static/**
      - .github/workflows/ci.yml
      - .github/workflows/cd.yml

jobs:
  validate-template:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint CloudFormation template
        run: |
          pip install cfn-lint
          cfn-lint cfn_templates/compute-stack.yaml cfn_templates/persistent-stack.yaml cfn_templates/network-stack.yaml cfn_templates/master-stack.yaml cfn_templates/waf-stack.yaml

  deploy:
    needs: validate-template
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/cd.yml
    secrets: inherit
    permissions:
      id-token: write
      contents: read
