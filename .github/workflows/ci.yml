name: CI

# Lint on PR and on push to main. CD runs only after this workflow succeeds (see cd.yml workflow_run).

on:
  pull_request:
    paths:
      - cfn_templates/**
      - static/**
      - .github/workflows/ci.yml
      - .github/workflows/cd.yml
  push:
    branches:
      - main
    paths:
      - cfn_templates/**
      - static/**
      - .github/workflows/ci.yml
      - .github/workflows/cd.yml

jobs:
  validate-template:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint CloudFormation template
        run: |
          pip install cfn-lint
          cfn-lint cfn_templates/compute-stack.yaml cfn_templates/persistent-stack.yaml cfn_templates/network-stack.yaml cfn_templates/master-stack.yaml cfn_templates/waf-stack.yaml
