name: CI

on:
  pull_request:
    paths:
      - compute-stack.yaml
      - storage-stack.yaml
      - static/**
      - .github/workflows/ci.yml
  push:
    branches:
      - main
    paths:
      - compute-stack.yaml
      - storage-stack.yaml
      - static/**
      - .github/workflows/ci.yml

jobs:
  validate-template:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint CloudFormation template
        run: |
          pip install cfn-lint
          cfn-lint compute-stack.yaml storage-stack.yaml
