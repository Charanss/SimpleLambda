name: CD

# Called from CI after lint on main, or run manually here. No local/Console deploy.

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      auth:
        description: How GitHub authenticates to AWS (manual runs only)
        type: choice
        options:
          - oidc
          - access-keys
        default: access-keys

env:
  AWS_REGION: ap-south-1
  COMPUTE_EDGE_STACK_NAME: simple-compute-dev-edge
  COMPUTE_EDGE_REGION: us-east-1
  MASTER_STACK_NAME: simple-master-dev
  COMPUTE_RESOURCE_PREFIX: simple-compute-dev
  COMPUTE_EDGE_RESOURCE_PREFIX: simple-compute-edge
  PERSISTENT_RESOURCE_PREFIX: simple-persistent-dev
  NETWORK_RESOURCE_PREFIX: simple-network-dev
  WAF_STACK_NAME: simple-waf-dev
  WAF_RESOURCE_PREFIX: simple-waf-dev
  TEMPLATES_S3_PREFIX: templates/

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.auth == 'oidc'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials (access keys)
        if: github.event_name == 'workflow_call' || (github.event_name == 'workflow_dispatch' && github.event.inputs.auth == 'access-keys')
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload nested templates to S3
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          TEMPLATES_BUCKET="simple-lambda-cfn-${ACCOUNT_ID}"
          if ! aws s3api head-bucket --bucket "${TEMPLATES_BUCKET}" 2>/dev/null; then
            aws s3api create-bucket \
              --bucket "${TEMPLATES_BUCKET}" \
              --region "${AWS_REGION}" \
              --create-bucket-configuration "LocationConstraint=${AWS_REGION}"
          fi
          aws s3 cp cfn_templates/compute-stack.yaml "s3://${TEMPLATES_BUCKET}/${TEMPLATES_S3_PREFIX}compute-stack.yaml"
          aws s3 cp cfn_templates/persistent-stack.yaml "s3://${TEMPLATES_BUCKET}/${TEMPLATES_S3_PREFIX}persistent-stack.yaml"
          aws s3 cp cfn_templates/network-stack.yaml "s3://${TEMPLATES_BUCKET}/${TEMPLATES_S3_PREFIX}network-stack.yaml"
          echo "TEMPLATES_BUCKET=${TEMPLATES_BUCKET}" >> "${GITHUB_ENV}"

      - name: Deploy compute edge Lambda (us-east-1)
        run: |
          aws cloudformation deploy \
            --template-file cfn_templates/compute-stack.yaml \
            --stack-name "${COMPUTE_EDGE_STACK_NAME}" \
            --region "${COMPUTE_EDGE_REGION}" \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              ResourceNamePrefix="${COMPUTE_EDGE_RESOURCE_PREFIX}" \
              EnableRegionalApp=false \
              EnableEdgeFunction=true \
            --no-fail-on-empty-changeset
          EDGE_ARN=$(aws cloudformation describe-stacks \
            --stack-name "${COMPUTE_EDGE_STACK_NAME}" \
            --region "${COMPUTE_EDGE_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='EdgeLambdaVersionArn'].OutputValue" \
            --output text)
          echo "EDGE_LAMBDA_VERSION_ARN=${EDGE_ARN}" >> "${GITHUB_ENV}"

      - name: Deploy WAF web ACL (us-east-1)
        run: |
          aws cloudformation deploy \
            --template-file cfn_templates/waf-stack.yaml \
            --stack-name "${WAF_STACK_NAME}" \
            --region "${COMPUTE_EDGE_REGION}" \
            --parameter-overrides \
              ResourceNamePrefix="${WAF_RESOURCE_PREFIX}" \
            --no-fail-on-empty-changeset
          WAF_ARN=$(aws cloudformation describe-stacks \
            --stack-name "${WAF_STACK_NAME}" \
            --region "${COMPUTE_EDGE_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='WebACLArn'].OutputValue" \
            --output text)
          echo "WEB_ACL_ARN=${WAF_ARN}" >> "${GITHUB_ENV}"

      - name: Deploy master stack (compute + persistent + network)
        run: |
          aws cloudformation deploy \
            --template-file cfn_templates/master-stack.yaml \
            --stack-name "${MASTER_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              TemplateS3Bucket="${TEMPLATES_BUCKET}" \
              TemplateS3Prefix="${TEMPLATES_S3_PREFIX}" \
              ComputeResourcePrefix="${COMPUTE_RESOURCE_PREFIX}" \
              PersistentResourcePrefix="${PERSISTENT_RESOURCE_PREFIX}" \
              NetworkResourcePrefix="${NETWORK_RESOURCE_PREFIX}" \
              EdgeLambdaVersionArn="${EDGE_LAMBDA_VERSION_ARN}" \
              WebACLArn="${WEB_ACL_ARN}" \
            --no-fail-on-empty-changeset

      - name: Upload index.html to S3
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "${MASTER_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" \
            --output text)
          aws s3 cp static/index.html "s3://${BUCKET}/index.html" \
            --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront cache
        run: |
          DIST_ID=$(aws cloudformation describe-stacks \
            --stack-name "${MASTER_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" \
            --output text)
          aws cloudfront create-invalidation \
            --distribution-id "${DIST_ID}" \
            --paths "/index.html" "/"

      - name: Stack outputs
        run: |
          echo "=== Master (ap-south-1) ==="
          aws cloudformation describe-stacks \
            --stack-name "${MASTER_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs" \
            --output table
          echo "=== Compute edge (us-east-1) ==="
          aws cloudformation describe-stacks \
            --stack-name "${COMPUTE_EDGE_STACK_NAME}" \
            --region "${COMPUTE_EDGE_REGION}" \
            --query "Stacks[0].Outputs" \
            --output table
          echo "=== WAF (us-east-1) ==="
          aws cloudformation describe-stacks \
            --stack-name "${WAF_STACK_NAME}" \
            --region "${COMPUTE_EDGE_REGION}" \
            --query "Stacks[0].Outputs" \
            --output table
