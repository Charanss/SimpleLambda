name: CD

on:
  workflow_dispatch:
    inputs:
      auth:
        description: How GitHub authenticates to AWS (manual runs only)
        type: choice
        options:
          - oidc
          - access-keys
        default: access-keys
  push:
    branches:
      - main
    paths:
      - compute-stack.yaml
      - storage-stack.yaml
      - static/**
      - .github/workflows/cd.yml

env:
  AWS_REGION: ap-south-1
  COMPUTE_STACK_NAME: simple-compute-dev
  STORAGE_STACK_NAME: simple-storage-dev

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.auth == 'oidc'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials (access keys)
        if: github.event_name == 'push' || github.event.inputs.auth == 'access-keys'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy compute stack
        run: |
          aws cloudformation deploy \
            --template-file compute-stack.yaml \
            --stack-name "${COMPUTE_STACK_NAME}" \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset

      - name: Deploy storage stack
        run: |
          aws cloudformation deploy \
            --template-file storage-stack.yaml \
            --stack-name "${STORAGE_STACK_NAME}" \
            --no-fail-on-empty-changeset

      - name: Upload index.html to S3
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "${STORAGE_STACK_NAME}" \
            --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" \
            --output text)
          aws s3 cp static/index.html "s3://${BUCKET}/index.html" \
            --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront cache
        run: |
          DIST_ID=$(aws cloudformation describe-stacks \
            --stack-name "${STORAGE_STACK_NAME}" \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" \
            --output text)
          aws cloudfront create-invalidation \
            --distribution-id "${DIST_ID}" \
            --paths "/index.html" "/"

      - name: Stack outputs
        run: |
          echo "=== Compute ==="
          aws cloudformation describe-stacks \
            --stack-name "${COMPUTE_STACK_NAME}" \
            --query "Stacks[0].Outputs" \
            --output table
          echo "=== Storage ==="
          aws cloudformation describe-stacks \
            --stack-name "${STORAGE_STACK_NAME}" \
            --query "Stacks[0].Outputs" \
            --output table
