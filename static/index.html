<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Simple Lambda · S3</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 2rem auto; padding: 0 1rem; }
    h1 { color: #232f3e; }
    #msg { margin-top: 1rem; padding: 1rem; background: #f2f8ff; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>Hello from S3</h1>
  <nav style="margin-bottom: 1rem;">
    <a href="/index.html">Home</a>
    <a href="/about.html">About</a>
  </nav>
  <p>Static <code>index.html</code> uploaded to your storage bucket.</p>
  <div id="msg"></div>
  <!-- nonce attribute is injected on this tag by Lambda@Edge (CSP script-src 'nonce-...') -->
  <script>
    (function () {
      var el = document.getElementById("msg");
      el.textContent = "Inline script ran at " + new Date().toLocaleString();
    })();
  </script>
</body>
</html>
